<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mytravels">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="shortcut icon" href="favicon.png?v=2"/>

  <title>mytravels</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      overscroll-behavior: none;
      background-color: #091424;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <script>
    window.flutterVoiceSearch = {
      recognition: null,
      isListening: false,

      isSupported: function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      },

      start: function(onResult, onError, onEnd) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          if (onError) onError("Voice recognition is not supported in this browser. Please use Chrome, Edge, or Safari.");
          return false;
        }

        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e) {}
          }
          this.recognition = new SpeechRec();
          this.recognition.continuous = false;
          this.recognition.interimResults = true;
          this.recognition.lang = 'en-IN'; // Optimized for Indian / Gulf airports & dates

          this.recognition.onresult = function(event) {
            let finalTranscript = '';
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
              } else {
                interimTranscript += event.results[i][0].transcript;
              }
            }
            const text = (finalTranscript || interimTranscript).trim();
            if (onResult && text) {
              onResult(text, !!finalTranscript);
            }
          };

          this.recognition.onerror = function(event) {
            console.warn("Speech recognition error:", event.error);
            if (onError) onError(event.error || "Speech error");
          };

          this.recognition.onend = function() {
            window.flutterVoiceSearch.isListening = false;
            if (onEnd) onEnd();
          };

          this.recognition.start();
          this.isListening = true;
          return true;
        } catch (err) {
          console.error("Speech recognition start failed:", err);
          if (onError) onError(err.toString());
          return false;
        }
      },

      stop: function() {
        if (this.recognition) {
          try {
            this.recognition.stop();
          } catch(e) {}
        }
        this.isListening = false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
